services:
  postgres:
    image: postgres:16-alpine
    container_name: study_scheduler_db
    environment:
      POSTGRES_DB: ${DB_NAME:-study_scheduler}
      POSTGRES_USER: ${DB_USER:-scheduler_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scheduler_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: study_scheduler_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
